environment: dev

databases:
  mysql:
    host: localhost
    port: 3306
    user: root
    password: password
    database: test_db

  oracle:
    host: localhost
    port: 1521
    user: admin
    password: password
    database: ORCL

  postgresql:
    host: localhost
    port: 5432
    user: postgres
    password: password
    database: test_db

apis:
  http:
    base_url: http://localhost:8080
    timeout: 30

  soap:
    endpoint: http://localhost:8080/soap
    timeout: 30

  graphql:
    endpoint: http://localhost:8080/graphql
    timeout: 30

timeout: 30

logging:
  level: DEBUG
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
