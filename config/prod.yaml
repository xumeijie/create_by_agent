environment: prod

databases:
  mysql:
    host: prod-mysql.example.com
    port: 3306
    user: prod_user
    password: ${PROD_DB_PASSWORD}
    database: prod_db

  oracle:
    host: prod-oracle.example.com
    port: 1521
    user: prod_user
    password: ${PROD_DB_PASSWORD}
    database: PROD

  postgresql:
    host: prod-pg.example.com
    port: 5432
    user: prod_user
    password: ${PROD_DB_PASSWORD}
    database: prod_db

apis:
  http:
    base_url: https://api.example.com
    timeout: 30

  soap:
    endpoint: https://api.example.com/soap
    timeout: 30

  graphql:
    endpoint: https://api.example.com/graphql
    timeout: 30

timeout: 30

logging:
  level: WARNING
