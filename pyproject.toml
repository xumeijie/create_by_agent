[tool.poetry]
name = "test-automation-framework"
version = "1.0.0"
description = "Comprehensive, modular test automation framework supporting multiple protocols and databases"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
repository = "https://github.com/yourusername/test-automation-framework"
keywords = ["testing", "automation", "pytest", "api", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
pytest = "^7.4.3"
pytest-xdist = "^3.5.0"
pytest-cov = "^4.1.0"
pytest-timeout = "^2.2.0"
requests = "^2.31.0"
pyyaml = "^6.0.1"
zeep = "^4.2.1"
mysql-connector-python = "^8.2.0"
oracledb = "^1.4.0"
psycopg2-binary = "^2.9.9"
locust = "^2.18.0"
allure-pytest = "^2.13.2"

[tool.poetry.group.dev.dependencies]
black = "^23.11.0"
flake8 = "^6.1.0"
isort = "^5.12.0"
mypy = "^1.7.0"
pytest-html = "^4.1.1"

[tool.poetry.group.docs.dependencies]
sphinx = "^7.2.6"
sphinx-rtd-theme = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "security: Security tests",
    "slow: Slow running tests",
    "smoke: Smoke tests",
]
addopts = "-v --tb=short -n auto"
log_cli = true
log_cli_level = "INFO"
log_file = "reports/pytest.log"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.coverage.run]
source = ["core", "adapters", "utils"]
omit = [
    "*/__init__.py",
    "*/conftest.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
